<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publier une annonce</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef1f7;color:#0b1f4d}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding:16px}
a{color:#1e63d6;text-decoration:none}
.bar{display:flex;justify-content:space-between;font-size:14px}
h2{margin:12px 0}
label{display:block;margin:14px 0 6px;font-weight:bold;font-size:14px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d5dbe8;border-radius:12px;font-size:15px;font-family:inherit}
textarea{height:90px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:#ff7a00;color:#fff;font-size:17px;font-weight:bold}
button:disabled{opacity:.6}
#out{background:none;color:#1e63d6;border:0;width:auto;margin:0;padding:0;font-size:14px;font-weight:normal}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><a href="index.html">← Retour</a><button id="out">Se déconnecter</button></div>
  <h2>Publier une annonce</h2>
  <label>Titre *</label>
  <input id="titre" placeholder="Ex : Appartement meublé à Lomé">
  <label>Catégorie *</label>
  <select id="cat">
    <option>Immobilier</option><option>Location</option><option>Vente</option>
    <option>Loisirs</option><option>Emploi</option><option>Services</option>
  </select>
  <label>Lieu *</label>
  <input id="lieu" placeholder="Ex : Baguida, Lomé">
  <label>Prix (FCFA) *</label>
  <input id="prix" type="number" placeholder="Ex : 350000">
  <label>Description</label>
  <textarea id="desc" placeholder="Décrivez votre bien ou service..."></textarea>
  <button id="btn">Publier</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCPz4uQi5i9rQAW1gBN-CXX8yCGS_uhUpU",
  authDomain: "appneed-b4350.firebaseapp.com",
  projectId: "appneed-b4350",
  storageBucket: "appneed-b4350.firebasestorage.app",
  messagingSenderId: "799172298311",
  appId: "1:799172298311:web:1598c292d14878fc08d362"
});
const db = getFirestore(app);
const auth = getAuth(app);
let user = null;

onAuthStateChanged(auth, u => {
  if (!u) { location.href = 'connexion.html'; return; }
  user = u;
});
document.getElementById('out').addEventListener('click', async () => {
  await signOut(auth);
  location.href = 'index.html';
});

document.getElementById('btn').addEventListener('click', async () => {
  if (!user) { location.href = 'connexion.html'; return; }
  const t = document.getElementById('titre').value.trim();
  const l = document.getElementById('lieu').value.trim();
  const p = document.getElementById('prix').value.trim();
  if (!t || !l || !p) { alert('Remplissez le titre, le lieu et le prix.'); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Publication...';
  try {
    await addDoc(collection(db, 'annonces'), {
      titre: t,
      categorie: document.getElementById('cat').value,
      lieu: l,
      prix: Number(p),
      desc: document.getElementById('desc').value,
      uid: user.uid,
      email: user.email,
      date: serverTimestamp()
    });
    alert('Annonce publiée !');
    location.href = 'index.html';
  } catch (e) {
    alert('Erreur : ' + e.message);
    btn.disabled = false; btn.textContent = 'Publier';
  }
});
</script>
</body>
</html>
