<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devenir vendeur vérifié</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef1f7;color:#0b1f4d}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding:16px}
a{color:#1e63d6;text-decoration:none}
h2{margin:12px 0}
label{display:block;margin:14px 0 6px;font-weight:bold;font-size:14px}
input,select{width:100%;padding:13px;border:1px solid #d5dbe8;border-radius:12px;font-size:15px;font-family:inherit}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px}
.chk input{width:auto;margin-top:3px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:#ff7a00;color:#fff;font-size:17px;font-weight:bold}
button:disabled{opacity:.6}
#etat{padding:14px;border-radius:12px;background:#eef6ff;margin:12px 0;display:none}
.note{font-size:13px;color:#555;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <a href="index.html">← Retour</a>
  <h2>Devenir vendeur vérifié</h2>
  <p class="note">Seuls les vendeurs vérifiés (particuliers ou entreprises) peuvent publier des annonces sur Appneed.</p>
  <div id="etat"></div>
  <div id="formulaire">
    <label>Vous êtes *</label>
    <select id="type"><option>Particulier</option><option>Entreprise</option></select>
    <label>Nom complet *</label>
    <input id="nom" placeholder="Nom et prénoms">
    <label>Nom de l'entreprise (si entreprise)</label>
    <input id="entreprise" placeholder="Ex : Immo Lomé SARL">
    <label>Date de naissance *</label>
    <input id="naiss" type="date">
    <label>Lieu de naissance *</label>
    <input id="lieun" placeholder="Ex : Lomé">
    <label>Numéro de téléphone *</label>
    <input id="tel" type="tel" placeholder="+228 ...">
    <label>Pièce d'identité que vous présenterez *</label>
    <select id="piece"><option>Carte d'identité</option><option>Passeport</option><option>Permis de conduire</option><option>Carte d'électeur</option></select>
    <div class="chk"><input id="ok" type="checkbox"><span>J'accepte que ces informations servent uniquement à vérifier mon identité. Je serai contacté par téléphone pour confirmer.</span></div>
    <button id="btn">Envoyer ma demande</button>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCPz4uQi5i9rQAW1gBN-CXX8yCGS_uhUpU",
  authDomain: "appneed-b4350.firebaseapp.com",
  projectId: "appneed-b4350",
  storageBucket: "appneed-b4350.firebasestorage.app",
  messagingSenderId: "799172298311",
  appId: "1:799172298311:web:1598c292d14878fc08d362"
});
const db = getFirestore(app);
const auth = getAuth(app);
const $ = id => document.getElementById(id);
let user = null;

function etat(texte, lienTexte, lienHref) {
  const e = $('etat');
  e.style.display = 'block';
  e.textContent = texte + ' ';
  if (lienHref) {
    const a = document.createElement('a');
    a.textContent = lienTexte; a.href = lienHref;
    e.appendChild(a);
  }
}

onAuthStateChanged(auth, async u => {
  if (!u) { location.href = 'connexion.html'; return; }
  user = u;
  try {
    const v = await getDoc(doc(db, 'verifications', u.uid));
    if (v.exists()) {
      const s = v.data().statut;
      if (s === 'verifie') { etat('Votre compte est vérifié.', 'Publier une annonce', 'publier.html'); $('formulaire').style.display = 'none'; }
      else if (s === 'en attente') { etat('Votre demande est en cours d\'examen. Nous vous contacterons par téléphone.'); $('formulaire').style.display = 'none'; }
      else if (s === 'refuse') { etat('Votre demande a été refusée. Vous pouvez la renvoyer avec des informations exactes.'); }
    }
  } catch (e) { etat('Erreur : ' + e.message); }
});

$('btn').addEventListener('click', async () => {
  if (!user) return;
  const nom = $('nom').value.trim(), naiss = $('naiss').value, lieun = $('lieun').value.trim(), tel = $('tel').value.trim();
  if (!nom || !naiss || !lieun || !tel) { alert('Remplissez tous les champs marqués *.'); return; }
  if (!$('ok').checked) { alert('Veuillez accepter la case de consentement.'); return; }
  const btn = $('btn');
  btn.disabled = true; btn.textContent = 'Envoi...';
  try {
    await setDoc(doc(db, 'verifications', user.uid), {
      uid: user.uid,
      email: user.email,
      type: $('type').value,
      nom: nom,
      entreprise: $('entreprise').value.trim(),
      naissance: naiss,
      lieuNaissance: lieun,
      telephone: tel,
      piece: $('piece').value,
      statut: 'en attente',
      date: serverTimestamp()
    });
    alert('Demande envoyée. Nous vous contacterons par téléphone.');
    location.reload();
  } catch (e) {
    alert('Erreur : ' + e.message);
    btn.disabled = false; btn.textContent = 'Envoyer ma demande';
  }
});
</script>
</body>
  </html>
